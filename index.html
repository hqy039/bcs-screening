<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>乳腺健康自查 · 小程序</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="phone">
    <!-- 状态栏 -->
    <div class="statusbar">
      <span class="sb-time">9:41</span>
      <span class="sb-icons">
        <span class="sb-signal">▂▄▆█</span>
        <span class="sb-wifi">📶</span>
        <span class="sb-battery">🔋</span>
      </span>
    </div>

    <!-- 顶部标题 -->
    <header class="app-header" id="appHeader">
      <span class="app-title" id="appTitle">乳腺健康自查</span>
      <div class="header-progress" id="headerProgress" hidden>
        <div class="header-progress-track"><div class="header-progress-fill" id="headerProgressFill"></div></div>
        <span class="header-progress-tip" id="headerProgressTip">已回答 0 / 0 题</span>
      </div>
    </header>

    <!-- 内容区 -->
    <main class="app-content" id="appContent"><!-- 各模块在此渲染 --></main>

    <!-- 底部 Tab 导航 -->
    <nav class="tabbar" id="tabbar">
      <div class="tab active" data-tab="questionnaire">
        <svg viewBox="0 0 24 24" class="tab-ico"><path d="M9 2h6a2 2 0 0 1 2 2v1h1a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h1V4a2 2 0 0 1 2-2zm0 3h6V4H9v1zm-2 3v11h10V8H7zm2 2h2v2H9v-2zm0 4h2v2H9v-2zm4-4h2v2h-2v-2zm0 4h2v2h-2v-2z"/></svg>
        <span>问卷</span>
      </div>
      <div class="tab" data-tab="tutorial">
        <svg viewBox="0 0 24 24" class="tab-ico"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm7 4v8l6-4-6-4z"/></svg>
        <span>教程</span>
      </div>
      <div class="tab" data-tab="result">
        <svg viewBox="0 0 24 24" class="tab-ico"><path d="M3 3h18v18H3V3zm2 2v14h14V5H5zm2 12h3V9H7v8zm5 0h3v-5h-3v5zm5 0h0v-8h0v8z"/><path d="M7 17h3V9H7v8zm5 0h3v-5h-3v5z"/></svg>
        <span>结果</span>
      </div>
      <div class="tab" data-tab="science">
        <svg viewBox="0 0 24 24" class="tab-ico"><path d="M4 3h16a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm2 4v2h6V7H6zm0 4v2h8v-2H6zm0 4v2h5v-2H6z"/></svg>
        <span>科普资讯</span>
      </div>
      <div class="tab" data-tab="mine">
        <svg viewBox="0 0 24 24" class="tab-ico"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-5 0-9 2.5-9 6v2h18v-2c0-3.5-4-6-9-6z"/></svg>
        <span>我的</span>
      </div>
    </nav>

    <!-- 通用弹层 -->
    <div class="modal-mask" id="modalMask" hidden>
      <div class="modal" id="modalBox"></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
